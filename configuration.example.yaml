# This legacy coordinator-only shape remains supported unchanged. To combine
# coordinators with independent status observers, use the structured form in
# configuration.status-observers.example.yaml and README.md.
valetudo_vacuum_coordinator:
  name: Downstairs Vacuum Coordinator
  vacuum_entity: vacuum.valetudo_robot
  # Optional, but enables one bounded mop-dock clean-stop during degraded
  # recovery and after an acknowledged stale task leaves dock status paused.
  identifier: robot
  people:
    - person.person_one
    - person.person_two
  away_delay: 300
  min_battery: 55
  # Retain the firmware's native task through charging and mop-rinse interruptions.
  # No fresh segment or vacuum.start fallback is issued on timeout.
  native_resume_enabled: true
  native_resume_timeout: 10800
  dock_settle: 60
  dispatch_start_timeout: 120
  # Applies to ordinary resource blocks; battery/charging/resumable waits use
  # native_resume_timeout only when the task is coordinator-owned.
  blocked_session_timeout: 300
  # Classify stale unowned resumable work without commands by default. Enable
  # only after confirming vacuum.stop clears the retained task on this model.
  stale_resume_auto_clear: false
  stale_resume_age: 1800
  stale_resume_settle: 60
  stale_resume_clear_timeout: 30
  # Reserved for future opt-in behavior; v0.1.3 keeps this inert.
  resume_nudge_enabled: false

  # MQTT topics are case-sensitive; replace `robot` with the exact Valetudo MQTT identifier.
  segment_command_topic: valetudo/robot/MapSegmentationCapability/clean/set
  status_flag_entity: sensor.valetudo_robot_status_flag
  dock_status_entity: sensor.valetudo_robot_dock_status
  error_entity: sensor.valetudo_robot_error
  battery_entity: sensor.valetudo_robot_battery
  current_area_entity: sensor.valetudo_robot_current_statistics_area
  current_time_entity: sensor.valetudo_robot_current_statistics_time
  estimated_segment_entity: sensor.valetudo_robot_estimated_segment

  # Optional: only keep these if the option names match your Valetudo select entities.
  mode_entity: select.valetudo_robot_mode
  mode_vacuum_option: vacuum
  mode_mop_option: vacuum_and_mop
  fan_entity: select.valetudo_robot_fan
  fan_auto_clean_option: max
  passes_entity: input_select.valetudo_robot_cleaning_passes
  auto_clean_iterations: 2
  water_entity: select.valetudo_robot_water
  water_mop_option: max

  # Optional: send one final away auto-clean summary through this notify service.
  notify_service: notify.household
  notification_url: /sfenton-react-dash/home?path=living-room#robot-vacuum

  # Optional: if these entities are not exposed in HA, omit them. Valetudo error text
  # still blocks known clean-water, dirty-water, detergent, and dock errors.
  fresh_water_entity: sensor.valetudo_robot_freshwater_dock_component
  dirty_water_entity: sensor.valetudo_robot_wastewater_dock_component
  detergent_entity: sensor.valetudo_robot_detergent_dock_component
  dustbag_entity: sensor.valetudo_robot_dustbag_dock_component

  # After an exact clean-water-empty fault, finish configured vacuum-only
  # rooms first, then vacuum each incomplete mop room once without full credit.
  allow_vacuum_only_when_mop_blocked: true
  cancel_any_away_run_on_arrival: true
  manual_tracking: true
  track_manual_when_paused: true

  rooms:
    - id: room_one
      name: Room One
      segment_id: "1"
      manual_credit_entity: input_boolean.room_one_selected
      min_duration: 120
      min_area: 0
    - id: room_two
      name: Room Two
      segment_id: "2"
      min_duration: 120
      min_area: 0
    - id: room_three
      name: Room Three
      segment_id: "3"
      min_duration: 180
      min_area: 0
    - id: room_four
      name: Room Four
      segment_id: "4"
      min_duration: 90
      min_area: 0
    - id: room_five
      name: Room Five
      segment_id: "5"
      min_duration: 120
      min_area: 0
    - id: room_six
      name: Room Six
      segment_id: "6"
      mop_required: true
      min_duration: 120
      min_area: 0
    - id: room_seven
      name: Room Seven
      segment_id: "7"
      mop_required: true
      min_duration: 90
      min_area: 0
